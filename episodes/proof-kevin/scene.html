<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOSS DE RIEN — Kévin proof</title>
<style>
html,body{margin:0;background:#111;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
</head>
<body>
<canvas id="film" width="720" height="1280"></canvas>
<script>
(() => {
const canvas=document.getElementById('film'),ctx=canvas.getContext('2d');
const W=720,H=1280,TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
const ease=(a,b,t)=>smooth((t-a)/(b-a));
function rr(x,y,w,h,r,fill,stroke=null,lw=2){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fillStyle=fill;ctx.fill()}
function line(points,color,width=4){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function text(str,x,y,size,color,weight='700',align='center'){ctx.font=weight+' '+size+'px system-ui,sans-serif';ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(str,x,y)}
function background(t){
 const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#17253c');g.addColorStop(.55,'#283d55');g.addColorStop(1,'#101b2a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // warm studio lights
 const glow=ctx.createRadialGradient(540,220,10,540,220,440);glow.addColorStop(0,'rgba(255,190,105,.22)');glow.addColorStop(1,'rgba(255,190,105,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 for(let i=0;i<7;i++){let x=i*132-30;rr(x,230,84,430,8,'rgba(8,15,25,.22)');rr(x+9,246,66,4,2,'rgba(255,255,255,.10)')}
 rr(0,900,W,380,0,'#182330');rr(0,900,W,8,0,'#35495b');
 // floor highlights
 for(let i=0;i<5;i++)line([[80+i*140,910],[40+i*160,1280]],'rgba(255,255,255,.045)',2);
}
function kevin(t){
 const enter=ease(0,.9,t),bounce=Math.sin(t*5.2)*5*enter;
 const react=ease(4.15,4.55,t),recover=ease(5.45,6.3,t);
 const x=360+(1-enter)*-230, y=892+bounce+Math.sin(t*2)*2;
 ctx.save();ctx.translate(x,y);
 // ground shadow
 ellipse(0,12,150,25,'rgba(0,0,0,.32)');
 // legs
 rr(-83,-130,65,150,24,'#202b39','#111923',5);rr(18,-130,65,150,24,'#202b39','#111923',5);
 // sneakers
 rr(-104,-8,94,34,15,'#e9e5db','#aeb7c2',3);rr(9,-8,94,34,15,'#e9e5db','#aeb7c2',3);
 line([[-86,8],[-31,8]],'#596575',4);line([[27,8],[82,8]],'#596575',4);
 // torso sweatshirt
 const body=ctx.createLinearGradient(-120,-470,120,-130);body.addColorStop(0,'#343c49');body.addColorStop(1,'#171e2a');
 ctx.beginPath();ctx.moveTo(-104,-490);ctx.quadraticCurveTo(-155,-465,-142,-310);ctx.lineTo(-116,-140);ctx.quadraticCurveTo(0,-105,116,-140);ctx.lineTo(142,-310);ctx.quadraticCurveTo(155,-465,104,-490);ctx.closePath();ctx.fillStyle=body;ctx.fill();ctx.lineWidth=7;ctx.strokeStyle='#101722';ctx.stroke();
 // folds
 line([[-91,-360],[-60,-310],[-72,-240]],'rgba(255,255,255,.12)',5);line([[92,-350],[61,-300],[76,-230]],'rgba(255,255,255,.10)',5);
 // arms
 ctx.save();ctx.translate(-112,-440);ctx.rotate(-.08+react*.62);rr(-25,0,52,230,24,'#303a48','#121a25',5);ellipse(0,222,25,27,'#75452f');ctx.restore();
 ctx.save();ctx.translate(112,-440);ctx.rotate(.08-react*.8);rr(-25,0,52,230,24,'#303a48','#121a25',5);ellipse(0,222,25,27,'#75452f');ctx.restore();
 // neck
 rr(-38,-540,76,90,20,'#87543a');
 // ears and head
 ellipse(-95,-635,25,38,'#8e5b40');ellipse(95,-635,25,38,'#8e5b40');
 const skin=ctx.createLinearGradient(-95,-730,105,-520);skin.addColorStop(0,'#a96d4d');skin.addColorStop(.55,'#8f583d');skin.addColorStop(1,'#6e402f');
 ctx.beginPath();ctx.moveTo(-90,-720);ctx.quadraticCurveTo(-120,-675,-100,-580);ctx.quadraticCurveTo(-70,-520,0,-515);ctx.quadraticCurveTo(78,-520,101,-585);ctx.quadraticCurveTo(120,-680,85,-720);ctx.closePath();ctx.fillStyle=skin;ctx.fill();ctx.strokeStyle='#4a2b24';ctx.lineWidth=5;ctx.stroke();
 // afro silhouette with textured curls
 const curls=[];for(let a=0;a<TAU;a+=.28){let r=104+8*Math.sin(a*5)+5*Math.cos(a*9);curls.push([Math.cos(a)*r,Math.sin(a)*r])}
 ctx.save();ctx.translate(0,-727);ctx.beginPath();ctx.moveTo(curls[0][0],curls[0][1]);for(const p of curls.slice(1))ctx.lineTo(p[0],p[1]);ctx.closePath();ctx.fillStyle='#171719';ctx.fill();ctx.strokeStyle='#08090b';ctx.lineWidth=5;ctx.stroke();
 for(let i=0;i<46;i++){let a=i*2.399,r=35+(i%9)*7,cx=Math.cos(a)*r,cy=Math.sin(a)*r;ellipse(cx,cy,9,7,i%3===0?'#34302e':'#211f20')}
 ctx.restore();
 // eyebrows / eyes
 const eyeSquint=react*.42;
 line([[-61,-650],[-28,-659]],'#38231e',8);line([[29,-659],[62,-650]],'#38231e',8);
 ellipse(-43,-628,12,15,'#fff0dc');ellipse(43,-628,12,15,'#fff0dc');
 ellipse(-40+react*5,-627,5,8,'#211b19');ellipse(46-react*5,-627,5,8,'#211b19');
 // nose and mouth changing from confident to awkward
 line([[0,-623],[-8,-594],[8,-590]],'#633c2e',5);
 if(react<.45){ctx.beginPath();ctx.moveTo(-31,-562);ctx.quadraticCurveTo(0,-540,31,-562);ctx.strokeStyle='#4b2521';ctx.lineWidth=6;ctx.stroke()}
 else {line([[-24,-558],[24,-558]],'#4b2521',6)}
 // hoodie strings
 line([[-25,-500],[-18,-410]],'#e8e5dc',5);line([[25,-500],[18,-410]],'#e8e5dc',5);
 // crown emblem
 ctx.save();ctx.translate(0,-330);ctx.fillStyle='#f3c94f';ctx.strokeStyle='#8b6720';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-34,18);ctx.lineTo(-28,-12);ctx.lineTo(-10,2);ctx.lineTo(0,-22);ctx.lineTo(12,2);ctx.lineTo(30,-12);ctx.lineTo(35,18);ctx.closePath();ctx.fill();ctx.stroke();rr(-35,22,70,8,3,'#f3c94f');ctx.restore();
 ctx.restore();
}
function phone(t){
 const pop=ease(3.1,3.55,t),shake=ease(4.0,4.25,t)*(1-ease(4.9,5.2,t));
 if(pop<=0)return;
 ctx.save();ctx.globalAlpha=pop;ctx.translate(555,650+Math.sin(t*4)*7);ctx.rotate(-.08+Math.sin(t*24)*.025*shake);
 rr(-68,-120,136,240,24,'#090d13','#8794a5',5);rr(-57,-104,114,206,15,'#f6f3eb');
 text('EURO SOCIAL',0,-70,13,'#263447','800');ellipse(0,-22,24,24,'#e9b64d');text('0',0,-14,24,'#152238','900');
 text('NOUVEAU',0,28,14,'#5b6674','700');text('ABONNÉ',0,50,16,'#263447','900');
 rr(-43,73,86,27,12,'#e8d9b6');text('Toujours 0',0,92,12,'#6b4a27','800');
 ctx.restore();
}
function render(t){
 ctx.clearRect(0,0,W,H);background(t);
 // title and scene captions
 text('BOSS DE RIEN',42,82,24,'#f3c94f','900','left');
 text('LE PLAN PARFAIT',42,116,14,'rgba(255,255,255,.68)','700','left');
 kevin(t);phone(t);
 if(t>6.1){let a=ease(6.1,6.8,t);ctx.globalAlpha=a;rr(58,1030,604,100,22,'rgba(8,13,21,.82)');text('« C’EST UN BUG, ÇA. »',360,1090,30,'#fff','900');ctx.globalAlpha=1}
 if(t>7.2){ctx.fillStyle='rgba(0,0,0,'+ease(7.2,8,t)+')';ctx.fillRect(0,0,W,H)}
}
window.renderFrame=render;window.__FILM_READY=true;render(0);
})();
</script>
</body>
</html>
