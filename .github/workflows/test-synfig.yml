name: Tester le moteur Synfig

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synfig-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Synfig et FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y synfig ffmpeg
          
      - name: Vérifier le moteur de rendu
        run: |
          set -euxo pipefail
          command -v synfig
          synfig --version
          synfig --targets
          ffmpeg -version | head -n 2

      - name: Enregistrer le diagnostic
        if: always()
        run: |
          mkdir -p dist/synfig-test
          {
            echo "=== OS ==="
            cat /etc/os-release
            echo
            echo "=== Synfig executable ==="
            command -v synfig || true
            echo
            echo "=== Synfig version ==="
            synfig --version 2>&1 || true
            echo
            echo "=== Synfig targets ==="
            synfig --targets 2>&1 || true
            echo
            echo "=== FFmpeg ==="
            ffmpeg -version 2>&1 | head -n 3 || true
          } > dist/synfig-test/diagnostic.txt

      - name: Publier le diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYNFIG-ENVIRONMENT-TEST
          path: dist/synfig-test/diagnostic.txt
          if-no-files-found: warn
          retention-days: 7
