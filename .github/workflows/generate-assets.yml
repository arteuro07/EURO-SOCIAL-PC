name: Générer les assets BOSS DE RIEN

on:
  workflow_dispatch:
  push:
    paths:
      - "gen_assets.py"
      - ".github/workflows/generate-assets.yml"
      - "boss_de_rien_bible.json"

permissions:
  contents: write

concurrency:
  group: boss-de-rien-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: python -m pip install requests pillow

      - name: Générer les images avec FLUX.1 schnell
        run: python gen_assets.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Enregistrer les nouvelles images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Aucune nouvelle image à enregistrer."
          else
            git commit -m "Génération des assets BOSS DE RIEN"
            git push
          fi
